; ============================================================================
;  models-preset.ini — шаблон списка моделей для router-режима llama.cpp.
;
;  Это НЕ запускаемый файл: в нём пути записаны плейсхолдерами
;  ${MODELS_DIR} / ${LLAMA_DIR} / ${PROJECT_DIR}. Универсальный запускатель
;  launch\router\run-router.bat раскрывает их и собирает рабочий файл
;  launch\router\models-preset.local.ini (в git не попадает), попутно
;  выбрасывая секции, чьи файлы на этом ПК отсутствуют.
;
;  Имя секции = имя модели (model id) в API. Клиент шлёт его в поле
;  "model" (или ?model=... в GET). Конфиг каждой секции повторяет
;  соответствующий .bat из launch\b11382-cu124\ (те же флаги).
;
;  Особенности router-режима:
;   - --models-max 1: одновременно живёт одна модель, остальные выгружены;
;   - host/port/alias/router-специфичные ключи задаёт сам сервер, в секции
;     они игнорируются (строку alias в пресетах поэтому не держим);
;   - неизвестный ключ = ошибка парсинга всего файла (см. build_preset.ps1);
;   - файл должен быть UTF-8 БЕЗ BOM (иначе парсер падает).
; ============================================================================

version = 1

