; ============================================================================
;  models-preset-rp.ini — шаблон RP-роутера: ТОЛЬКО проверенные RP-модели.
;
;  Запуск: launch\router\run-rp-router.bat (порт 9932).
;  Шаблон и запускатель те же, что у общего роутера; отличается состав и
;  назначение. Пути — плейсхолдерами ${MODELS_DIR} / ${LLAMA_DIR} / ${PROJECT_DIR};
;  рабочий файл models-preset-rp.local.ini собирает build_preset.ps1 и
;  автоматически выбрасывает секции, чьих файлов на этом ПК нет.
;
;  Состав — по итогам оценки RP LLM-судьёй (полный набор 6 сценариев,
;  два судьи; подробности — docs\quality\rp-quality-eval.md):
;
;   Ядро (Gemma-4-31B dense, RU 99-100 %):
;      gemma4-31b-blume-v1        Giftige-Blume-v1  4.33/3.35  лучшая инициатива
;      gemma4-31b-schattenblume   Schattenblume     4.38/3.28
;      gemma4-31b-glistening      Glistening-Gem    4.32/3.35
;      gemma4-31b-dark-thoughts   Dark-Thoughts V2  4.24/3.11  эталон
;   Быстрые MoE (скомпромисс качество/скорость):
;      gemma4-26a4b-styletune-rp  StyleTune-26B     RP ~63 t/s (без спекуляции)
;      gemma4-26a4b-goetia        Goetia-26B-A4B    ~73 t/s (⚠️ путает сущности)
;
;  РЕЖИМ. Рабочий у 31B-мержей — NoThink (think капризен: пустые ответы из-за
;  незакрытого канала). Think-варианты оставлены для сравнения; у Goetia think
;  в llama.cpp непригоден (утечка reasoning) — помечено ниже.
;  Файла Goetia на стенде нет: секция отсеется автоматически, появится сама,
;  когда модель скачают.
; ============================================================================

version = 1

; ---------------------------------------------------------------------------
;  Giftige-Blume-v1-31B (i1-IQ3_XXS) — №1 Combined RP, лучшая инициатива
; ---------------------------------------------------------------------------

[gemma4-31b-blume-v1]
model = ${MODELS_DIR}\mradermacher\Gemma-4-Giftige-Blume-31B-v1-i1-GGUF\Gemma-4-Giftige-Blume-31B-v1.i1-IQ3_XXS.gguf
model-draft = ${MODELS_DIR}\mradermacher\Gemma-4-Queen-31B-it-uncensored-heretic-i1-GGUF\gemma-4-31B-it-assistant.Q4_K_M.gguf
np = 1
c = 51200
fa = on
fit = on
load-mode = none
t = 12
tb = 12
ctk = q4_0
ctv = q4_0
spec-type = draft-mtp
spec-draft-n-max = 5
spec-draft-n-min = 1
spec-draft-p-min = 0.75
jinja = true
reasoning = off
reasoning-budget = 0
temp = 0.6
min-p = 0.1
top-k = 0
top-p = 0.95

[gemma4-31b-blume-v1-think]
model = ${MODELS_DIR}\mradermacher\Gemma-4-Giftige-Blume-31B-v1-i1-GGUF\Gemma-4-Giftige-Blume-31B-v1.i1-IQ3_XXS.gguf
